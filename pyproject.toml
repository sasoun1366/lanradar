[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanradar"
version = "0.1.0"
description = "One-file LAN radar: discover live devices (IP, MAC, vendor) on your network — ARP + ping sweep, OUI vendor ID, watch mode for new/leave events."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lanradar contributors" }]
keywords = [
    "network",
    "discovery",
    "arp",
    "ping-sweep",
    "inventory",
    "monitoring",
    "oui",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration :: Inventory",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
ui = ["rich>=13.0"]
dev = ["pytest>=7", "rich>=13.0"]

[project.scripts]
lanradar = "lanradar:main"

[tool.setuptools]
py-modules = ["lanradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
